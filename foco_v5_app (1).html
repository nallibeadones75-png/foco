<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCO — Panel de Productividad Estudiantil</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
        colors: {
          brand: { 
            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 
            500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' 
          }
        },
        animation: {
          'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          'scale-in': 'scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
          slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          scaleIn: { '0%': { opacity: '0', transform: 'scale(0.97)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.8);
  }
  .dark .glass-panel {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(51, 65, 85, 0.8);
  }
</style>
</head>
<body class="h-full bg-[#f8fafc] dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300 overflow-hidden">

<div class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col justify-between shrink-0 select-none z-30 transition-colors">
    <div class="p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <div>
          <h1 class="font-extrabold text-xl tracking-tight leading-none text-slate-900 dark:text-white">FOCO</h1>
          <p class="text-[11px] font-medium text-slate-400 mt-0.5">Tu semestre en foco</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1.5">
        <button onclick="switchTab('inicio')" id="nav-inicio" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          Inicio
        </button>
        <button onclick="switchTab('actividades')" id="nav-actividades" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          Mis actividades
        </button>
        <button onclick="switchTab('calendario')" id="nav-calendario" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Calendario
        </button>
        <button onclick="switchTab('estadisticas')" id="nav-estadisticas" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          Estadísticas
        </button>
        <button onclick="switchTab('pomodoro')" id="nav-pomodoro" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Pomodoro
        </button>
        <button onclick="switchTab('notas')" id="nav-notas" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          Notas rápidas
        </button>
      </nav>

      <!-- Asignaturas Sidebar -->
      <div class="mt-8">
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Asignaturas</span>
          <button onclick="openSubjectModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
        <div id="sidebar-subjects" class="space-y-1.5">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <div class="p-4 m-4 rounded-3xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 flex flex-col gap-2">
      <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-xs">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/></svg>
        Consejo FOCO
      </div>
      <p class="text-[11px] text-slate-600 dark:text-slate-300 font-medium leading-relaxed">Disciplina hoy, oportunidades mañana.</p>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- TOPBAR -->
    <header class="h-20 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-8 flex items-center justify-between z-20 shrink-0">
      <div class="flex items-center gap-4 flex-1 max-w-xl">
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </span>
          <input id="global-search" oninput="handleGlobalSearch(this.value)" class="w-full pl-10 pr-4 py-2.5 bg-slate-100 dark:bg-slate-800 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 transition-all" placeholder="Buscar actividades, asignaturas...">
        </div>
      </div>

      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-amber-400 transition-all shadow-sm" title="Cambiar tema">
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"></path></svg>
        </button>

        <button onclick="openProfileModal()" class="flex items-center gap-3 pl-2 pr-3 py-1.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-sm" id="user-avatar-initial">A</div>
          <span class="text-sm font-bold text-slate-700 dark:text-slate-200" id="user-name-display">Alex</span>
        </button>
      </div>
    </header>

    <!-- CONTENT VIEWS CONTAINER -->
    <main class="flex-1 overflow-y-auto p-8 relative" id="main-container">
      <!-- Dynamic View Injection Here -->
    </main>

  </div>
</div>

<!-- MODALS & CAMERA SIMULATOR -->
<!-- Camera Simulator Modal -->
<div id="camera-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden animate-fade-in">
  <div class="glass-panel rounded-3xl p-6 max-w-md w-full shadow-2xl animate-scale-in">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-extrabold flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
        Simulador de Cámara / Evidencia
      </h3>
      <button onclick="closeCameraModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="space-y-4">
      <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl h-56 flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-800/50 relative overflow-hidden group">
        <div id="camera-preview" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center">
          <div class="w-16 h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mb-3 shadow-sm">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
          </div>
          <p class="text-sm font-bold text-slate-700 dark:text-slate-200">Enfoque tu trabajo o tarea</p>
          <p class="text-xs text-slate-400 mt-1">Haz clic en disparar para adjuntar evidencia fotográfica</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="simulateCapturePhoto()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl transition-all shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
          Disparar / Capturar foto
        </button>
        <button onclick="closeCameraModal()" class="px-4 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-slate-700 dark:text-slate-200 rounded-2xl transition-all text-sm">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- Task Modal (Add / Edit) -->
<div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden animate-fade-in">
  <div class="glass-panel rounded-3xl p-6 max-w-lg w-full shadow-2xl animate-scale-in">
    <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100 dark:border-slate-800">
      <h3 id="task-modal-title" class="text-lg font-extrabold flex items-center gap-2">Nueva Actividad</h3>
      <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="space-y-4">
      <input type="hidden" id="edit-task-id">
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Nombre de la actividad</label>
        <input id="modal-f-name" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-sm" placeholder="Ej. Ensayo final arquitectura">
      </div>
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Asignatura</label>
        <select id="modal-f-subject" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-sm cursor-pointer">
          <!-- Dynamically populated -->
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Fecha límite</label>
          <input id="modal-f-date" type="date" class="w-full px-3 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-xs sm:text-sm">
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Tipo</label>
          <select id="modal-f-type" class="w-full px-3 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-xs sm:text-sm cursor-pointer">
            <option>Entrega</option>
            <option>Prueba</option>
            <option>Presentación</option>
            <option>Trabajo</option>
            <option>Lectura</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Prioridad</label>
        <select id="modal-f-priority" class="w-full px-3 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-xs sm:text-sm cursor-pointer">
          <option value="Alta">Alta 🔥</option>
          <option value="Media" selected>Media</option>
          <option value="Baja">Baja 🟢</option>
        </select>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-6 pt-4 border-t border-slate-100 dark:border-slate-800">
      <button onclick="saveTaskModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl transition-all shadow-lg shadow-indigo-500/25 text-sm">Guardar Actividad</button>
      <button onclick="closeTaskModal()" class="px-4 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-slate-700 dark:text-slate-200 rounded-2xl text-sm">Cancelar</button>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div id="profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden animate-fade-in">
  <div class="glass-panel rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-scale-in text-center">
    <div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white font-extrabold flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-indigo-500/30" id="profile-modal-initial">A</div>
    <h3 class="text-lg font-extrabold mb-1" id="profile-modal-name">Alex</h3>
    <p class="text-xs text-slate-400 mb-6">Estudiante Universitario · FOCO Pro</p>
    <div class="space-y-3 text-left mb-6">
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Nombre de usuario</label>
        <input id="input-profile-name" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold outline-none" value="Alex">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <button onclick="closeProfileModal()" class="py-3 px-4 rounded-xl font-bold text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">Cancelar</button>
      <button onclick="saveProfile()" class="py-3 px-4 rounded-xl font-bold text-xs bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/25">Guardar</button>
    </div>
  </div>
</div>

<!-- Subject Modal -->
<div id="subject-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden animate-fade-in">
  <div class="glass-panel rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-scale-in">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-extrabold">Nueva Asignatura</h3>
      <button onclick="closeSubjectModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-xl">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Nombre del Ramo</label>
        <input id="new-subject-name" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold outline-none" placeholder="Ej. Inteligencia Artificial">
      </div>
      <div>
        <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Color distintivo</label>
        <select id="new-subject-color" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold outline-none cursor-pointer">
          <option value="bg-indigo-500">Índigo / Azul</option>

function renderActividadesView() {
  const listContainer = document.getElementById('full-task-list');
  if (!listContainer) return;

  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const f = document.getElementById('filter-select')?.value || 'pending';
  const s = document.getElementById('sort-select')?.value || 'priority';

  let arr = [...tasks];
  if (q) arr = arr.filter(t => (t.name + ' ' + t.subject + ' ' + t.type).toLowerCase().includes(q));
  if (f === 'pending') arr = arr.filter(t => !t.done);
  if (f === 'done') arr = arr.filter(t => t.done);

  const rank = { Alta: 0, Media: 1, Baja: 2 };
  arr.sort((a,b) => {
    if (s === 'date') return a.date.localeCompare(b.date);
    const pDiff = rank[a.priority] - rank[b.priority];
    return pDiff !== 0 ? pDiff : a.date.localeCompare(b.date);
  });

  if (!arr.length) {
    listContainer.innerHTML = `
      <div class="glass-panel rounded-3xl p-12 text-center">
        <p class="text-sm font-bold text-slate-400">No hay actividades que coincidan con la búsqueda.</p>
      </div>`;
    return;
  }

  listContainer.innerHTML = arr.map(t => {
    const urg = getUrgencyInfo(t.date);
    return `
      <div class="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-all hover:shadow-md ${t.done ? 'opacity-60 bg-slate-50/50' : ''}">
        <div class="flex items-start sm:items-center gap-4 flex-1">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" class="w-5 h-5 rounded-lg accent-indigo-600 cursor-pointer mt-1 sm:mt-0">
          <div>
            <h4 class="text-base font-extrabold ${t.done ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'} mb-1">${escapeHtml(t.name)}</h4>
            <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
              <span class="text-slate-500">${escapeHtml(t.subject)}</span>
              <span>·</span>
              <span class="${urg.cls}">${urg.text}</span>
              <span>·</span>
              <span class="text-slate-400">${formatDate(t.date)}</span>
              <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400">${escapeHtml(t.type)}</span>
              <span class="px-2.5 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(t.priority)}</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2 self-end sm:self-center">
          ${t.photo ? `<span class="px-2 py-1 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-bold flex items-center gap-1">📷 1 foto</span>` : `<button onclick="openCameraModal(${t.id})" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" title="Sacar foto">📷</button>`}
          <button onclick="openTaskModal(${t.id})" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" title="Editar">✏️</button>

function initPomodoroEvents() {}

function togglePomodoroTimer() {
  const btn = document.getElementById('pomo-main-btn');
  if (pomodoroRunning) {
    clearInterval(pomodoroInterval);
    pomodoroRunning = false;
    if (btn) btn.textContent = 'Reanudar';
  } else {
    pomodoroRunning = true;
    if (btn) btn.textContent = 'Pausar';
    pomodoroInterval = setInterval(() => {
      if (pomodoroSeconds > 0) {
        pomodoroSeconds--;
      } else if (pomodoroMinutes > 0) {
        pomodoroMinutes--;
        pomodoroSeconds = 59;
      } else {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
        showToast('¡Sesión de Pomodoro completada con éxito! 🚀');
        resetPomodoroTimer();
      }
      const clock = document.getElementById('pomo-clock');
      if (clock) {
        clock.textContent = `${String(pomodoroMinutes).padStart(2,'0')}:${String(pomodoroSeconds).padStart(2,'0')}`;
      }
    }, 1000);
  }
}

function resetPomodoroTimer() {
  clearInterval(pomodoroInterval);
  pomodoroRunning = false;
  pomodoroMinutes = workDuration;
  pomodoroSeconds = 0;
  const clock = document.getElementById('pomo-clock');
  const btn = document.getElementById('pomo-main-btn');
  if (clock) clock.textContent = `${String(pomodoroMinutes).padStart(2,'0')}:00`;
  if (btn) btn.textContent = 'Iniciar Sesión';
}

function updatePomodoroSettings() {
  workDuration = parseInt(document.getElementById('setting-work-time').value) || 25;
  breakDuration = parseInt(document.getElementById('setting-break-time').value) || 5;
  resetPomodoroTimer();
  showToast('Tiempos actualizados');
}

function openNewNotePrompt() {
  const text = prompt('Escribe el contenido de tu nota rápida / post-it:');

    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    notes.unshift({
      id: Date.now(),
      text: text.trim(),
      color: randomColor,
      date: new Date().toLocaleDateString('es-CL', {day: '2-digit', month: 'short'})

// --- GENERAL MODALS & ACTIONS ---
function openTaskModal(taskId = null) {
  const modal = document.getElementById('task-modal');
  const title = document.getElementById('task-modal-title');
  const subjectSelect = document.getElementById('modal-f-subject');

  subjectSelect.innerHTML = subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

  if (taskId) {
    const t = tasks.find(x => x.id === taskId);
    if (t) {
      title.textContent = 'Editar Actividad';
      document.getElementById('edit-task-id').value = t.id;
      document.getElementById('modal-f-name').value = t.name;
      document.getElementById('modal-f-subject').value = t.subject;
      document.getElementById('modal-f-date').value = t.date;
      document.getElementById('modal-f-type').value = t.type;
      document.getElementById('modal-f-priority').value = t.priority;
    }
  } else {
    title.textContent = 'Nueva Actividad';
    document.getElementById('edit-task-id').value = '';
    document.getElementById('modal-f-name').value = '';
    document.getElementById('modal-f-date').value = new Date().toISOString().split('T0')[0];
  }
  modal.classList.remove('hidden');
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.add('hidden');
}

function saveTaskModal() {
  const id = document.getElementById('edit-task-id').value;
  const name = document.getElementById('modal-f-name').value.trim();
  const subject = document.getElementById('modal-f-subject').value;
  const date = document.getElementById('modal-f-date').value;
  const type = document.getElementById('modal-f-type').value;
  const priority = document.getElementById('modal-f-priority').value;

  if (!name || !date) {
    showToast('Completa el nombre y la fecha', 'error');
    return;
  }

  if (id) {
    const t = tasks.find(x => x.id == id);
    if (t) {
      t.name = name; t.subject = subject; t.date = date; t.type = type; t.priority = priority;
    }
    showToast('Actividad actualizada');
  } else {
    tasks.push({
      id: Date.now(),
      name, subject, date, type, priority, done: false, photo: null
    });
    showToast('Actividad creada con éxito');
  }
  saveData();
  closeTaskModal();
  renderCurrentView();
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    saveData();
    renderCurrentView();
    if (t.done) showToast('¡Actividad completada!');
  }
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveData();
  renderCurrentView();
  showToast('Actividad eliminada', 'error');
}

// Camera Simulator
function openCameraModal(taskId) {
  photoTargetTaskId = taskId;
  document.getElementById('camera-modal').classList.remove('hidden');
}

function closeCameraModal() {
  document.getElementById('camera-modal').classList.add('hidden');
  photoTargetTaskId = null;
}

function simulateCapturePhoto() {
  if (photoTargetTaskId) {
    const t = tasks.find(x => x.id === photoTargetTaskId);
    if (t) {
      t.photo = 'captured';
      saveData();
      showToast('¡Foto de evidencia guardada con éxito! 📸');
    }
  }
  closeCameraModal();
  renderCurrentView();
}

// Profile Modal
function openProfileModal() {
  document.getElementById('input-profile-name').value = userProfile.name;
  document.getElementById('profile-modal-name').textContent = userProfile.name;
  document.getElementById('profile-modal-initial').textContent = userProfile.name.charAt(0).toUpperCase();
  document.getElementById('profile-modal').classList.remove('hidden');
}

function closeProfileModal() {
  document.getElementById('profile-modal').classList.add('hidden');
}

function saveProfile() {
  const newName = document.getElementById('input-profile-name').value.trim();
  if (newName) {
    userProfile.name = newName;
    saveData();
    updateHeaderProfile();
    closeProfileModal();
    showToast('Perfil actualizado');
    renderCurrentView();
  }
}

// Subject Modal
function openSubjectModal() {
  document.getElementById('subject-modal').classList.remove('hidden');
}

function closeSubjectModal() {
  document.getElementById('subject-modal').classList.add('hidden');
}

function saveNewSubject() {
  const name = document.getElementById('new-subject-name').value.trim();
  const color = document.getElementById('new-subject-color').value;
  if (name) {
    if (!subjects.some(s => s.name.toLowerCase() === name.toLowerCase())) {
      subjects.push({name, color});
      saveData();
      renderSidebarSubjects();
      closeSubjectModal();
      showToast(`Asignatura "${name}" agregada`);
    } else {
      showToast('Ese ramo ya existe', 'error');
    }
  }
}

// Utility Helpers
function getUrgencyInfo(dateStr) {
  const tDate = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.ceil((tDate - today) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return { text: "Vencida", cls: "text-rose-600 bg-rose-50 dark:bg-rose-950/50" };
  if (diffDays === 0) return { text: "Vence hoy", cls: "text-amber-600 bg-amber-50 dark:bg-amber-950/50" };
  if (diffDays === 1) return { text: "Vence mañana", cls: "text-emerald-600 bg-emerald-50 dark:bg-emerald-950/50" };
  return { text: `Faltan ${diffDays} días`, cls: "text-slate-500 bg-slate-100 dark:bg-slate-800" };
}

function formatDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  return (str || '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// Initial Render
renderCurrentView();
</script>
